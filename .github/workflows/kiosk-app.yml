name: Программа-киоск (Windows)

on:
  push:
    branches: [main, kiosk-v1]
    paths: ['app/**', 'src/data/**', '.github/workflows/kiosk-app.yml']
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # app/ берёт схему настроек заставки из src/data (а та — zod из корня).
      - name: Зависимости
        run: |
          npm ci --ignore-scripts
          npm ci --prefix app

      - name: Тесты
        run: npm test --prefix app

      - name: Версия
        id: ver
        run: echo "version=$(node -p "require('./app/package.json').version")" >> $env:GITHUB_OUTPUT

      # На Windows electron-builder вшивает в exe название и версию (в «Диспетчере задач» — MaximaKiosk, а не Electron).
      - name: Сборка установщика
        working-directory: app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build
          npx electron-builder --win nsis --x64 --publish never "-c.win.signAndEditExecutable=true"


      - name: Настоящие установщики 0.1.3 и 0.1.5 для проверки обновления
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download app-v0.1.3 --repo GinaliArseny/maxima-kiosk --pattern MaximaKiosk-Setup-0.1.3.exe --dir app/old
          gh release download app-v0.1.5 --repo GinaliArseny/maxima-kiosk --pattern MaximaKiosk-Setup-0.1.5.exe --dir app/old
          if ((Get-FileHash app/old/MaximaKiosk-Setup-0.1.5.exe -Algorithm SHA256).Hash -ne 'D0C4ABE1FC53D041D91E7B0AA1041EDB9375A57E1C7A27BD9AAF7E6C5B610F93') { throw 'Контрольная сумма 0.1.5 не совпала' }
          if ((Get-FileHash app/old/MaximaKiosk-Setup-0.1.3.exe -Algorithm SHA256).Hash -ne '80F1B52107871FE1E112248D770D12AE249145BCC9982047FCF1783465C0EADB') { throw 'Контрольная сумма 0.1.3 не совпала' }

      - name: Проверка на Windows — обновление поверх запущенной, аварийный выход
        working-directory: app
        run: ./ci/smoke.ps1 -OldInstaller (Resolve-Path old/MaximaKiosk-Setup-0.1.3.exe) -IntermediateInstaller (Resolve-Path old/MaximaKiosk-Setup-0.1.5.exe) -NewInstaller (Resolve-Path release/MaximaKiosk-Setup-${{ steps.ver.outputs.version }}.exe) -NewVersion ${{ steps.ver.outputs.version }}

      - name: Снимки экрана
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: app/shots/

      - name: Установщик
        uses: actions/upload-artifact@v4
        with:
          name: MaximaKiosk-Setup-${{ steps.ver.outputs.version }}
          path: app/release/MaximaKiosk-Setup-${{ steps.ver.outputs.version }}.exe

      - name: Релиз (тег app-v*)
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "app/release/MaximaKiosk-Setup-${{ steps.ver.outputs.version }}.exe" deploy/kiosk-update-0.2.1.md --title "Программа-киоск ${{ steps.ver.outputs.version }}" --notes "Обновление поверх 0.1.3/0.1.5 с сохранением PIN и Jellyfin. Локальный журнал заставки и кнопка Сохранить отчёт после PIN. Без автозапуска и скриптов."
