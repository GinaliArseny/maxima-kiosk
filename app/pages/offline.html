<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Подключаемся…</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: grid; place-items: center; background: #f4f6f8; color: #2b2b2b; font: 40px/1.4 'Segoe UI', system-ui, sans-serif; text-align: center; cursor: default; user-select: none; }
      small { display: block; font-size: 26px; color: #5f6368; margin-top: 16px; }
      .dot { display: inline-block; width: 18px; height: 18px; margin: 0 6px; border-radius: 50%; background: #0b8ab0; animation: b 1.2s infinite ease-in-out; }
      .dot:nth-child(2) { animation-delay: 0.2s; background: #f18a1e; }
      .dot:nth-child(3) { animation-delay: 0.4s; background: #8dbf2e; }
      @keyframes b { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div>
      <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      Подключаемся…
      <small>Стоматологический центр «Максима»</small>
    </div>
  </body>
</html>
