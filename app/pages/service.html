<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Обслуживание киоска</title>
    <style>
      * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
      html, body { margin: 0; height: 100%; }
      body { background: rgba(20, 24, 33, 0.94); color: #fff; font: 26px/1.4 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 24px 0; overflow-y: auto; }
      #root { margin: auto 0; flex: 0 0 auto; width: min(760px, 92vw); display: flex; flex-direction: column; align-items: center; gap: 20px; }
      h1 { font-size: 40px; margin: 0; text-align: center; }
      button { font: inherit; min-height: 96px; border-radius: 20px; border: 0; background: #2f3a4d; color: #fff; cursor: pointer; }
      button:active { filter: brightness(1.3); }
      .primary { background: #0b8ab0; }
      .danger { background: #8a2c2c; }
      .muted { background: #3a3f48; }
      .wide { width: 100%; }
      .pad { display: grid; grid-template-columns: repeat(3, 160px); gap: 16px; }
      .pad button { font-size: 40px; }
      .dots { font-size: 48px; letter-spacing: 12px; min-height: 64px; }
      .note { color: #c8d0dc; text-align: center; margin: 0; min-height: 1.4em; }
      .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; }
      .checks { max-height: 42vh; overflow-y: auto; list-style: none; padding: 0; margin: 0; width: 100%; }
      .checks li { padding: 12px 0; border-bottom: 1px solid #3a3f48; }
      .ok { color: #8fd18f; }
      .bad { color: #ff9b9b; }
      form { display: flex; flex-direction: column; gap: 14px; width: 100%; }
      .field { display: flex; flex-direction: column; gap: 6px; font-size: 20px; }
      input { font: inherit; padding: 14px; border-radius: 12px; border: 0; -webkit-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="../dist/service-page.js"></script>
  </body>
</html>
