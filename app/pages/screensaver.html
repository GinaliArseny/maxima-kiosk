<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src http: https:; style-src 'unsafe-inline'" />
    <title>Заставка</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; user-select: none; }
      video { position: fixed; inset: 0; width: 100%; height: 100%; }
      #fg { object-fit: contain; }
      #bg { object-fit: cover; filter: blur(40px) brightness(0.6); transform: scale(1.1); }
    </style>
  </head>
  <body>
    <video id="bg" muted playsinline hidden></video>
    <video id="fg" playsinline></video>
    <script src="../dist/screensaver-page.js"></script>
  </body>
</html>
