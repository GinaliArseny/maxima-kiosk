appId: ru.maxima.kiosk.test
productName: MaximaKioskTest
copyright: ООО «ОРТОС»
directories:
  output: release
files:
  - dist/**
  - pages/**
  - package.json
npmRebuild: false
win:
  # Правка ресурсов exe (иконка, версия) требует rcedit под Wine на macOS — пропускаем.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Своя проверка «программа запущена?» — штатная находит при обновлении сам деинсталлятор.
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Максима Киоск — Тест
  # Не запускать после установки: под администратором окно на весь экран без PIN не закрыть.
  runAfterFinish: false
