appId: ru.maxima.kiosk
productName: MaximaKiosk
copyright: ООО «ОРТОС»
directories:
  output: release
files:
  - dist/**
  - pages/**
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Киоск «Максима»
