# Киоск «Максима» — статика (Vite build). certbot --nginx допишет 443/ssl сам.
server {
    listen 80;
    server_name kiosk.339933.net;

    root /opt/maxima-kiosk/dist;
    index index.html;

    # add_header в location отменяет заголовки сервера — поэтому общий набор
    # повторяется в каждом location с собственным add_header.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;

    # Service worker и его регистрация — всегда свежие, иначе обновления
    # не доедут до киоска.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Данные и документы меняются без смены имени файла — только ревалидация.
    location /data/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /docs/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Сборочные файлы с хэшем в имени — навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # HashRouter: все маршруты внутри index.html, других путей нет.
    location / {
        try_files $uri $uri/ =404;
    }
}
